name: Build and Deploy

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  LLVM_VERSION: '23'
  ONLYC_SITE_ORIGIN: ${{ vars.ONLYC_SITE_ORIGIN || 'https://34049.trungnt2910.com' }}

jobs:
  build:
    name: Build Website and Test Host Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add LLVM Repository
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          . /etc/os-release
          llvm_repository="deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc]"
          llvm_repository="${llvm_repository} https://apt.llvm.org/${VERSION_CODENAME}/"
          llvm_repository="${llvm_repository} llvm-toolchain-${VERSION_CODENAME}"
          echo "${llvm_repository}-${LLVM_VERSION} main" |
            sudo tee "/etc/apt/sources.list.d/llvm-${LLVM_VERSION}.list" > /dev/null

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y                                                 \
            "clang-${LLVM_VERSION}"                                               \
            "lld-${LLVM_VERSION}"                                                 \
            "llvm-${LLVM_VERSION}"                                                \
            "libc++-${LLVM_VERSION}-dev"                                          \
            "libc++abi-${LLVM_VERSION}-dev"                                       \
            cmake                                                                 \
            ninja-build

      - name: Configure
        run: |
          wasm_ar="$(command -v "llvm-ar-${LLVM_VERSION}")"
          wasm_ranlib="$(command -v "llvm-ranlib-${LLVM_VERSION}")"
          wasm_linker="$(command -v "wasm-ld-${LLVM_VERSION}")"
          wasm_flags="-DCMAKE_AR=${wasm_ar};-DCMAKE_RANLIB=${wasm_ranlib}"
          wasm_flags="${wasm_flags};-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=${wasm_linker}"
          cmake                                                                   \
            -S .                                                                  \
            -B build                                                              \
            -G Ninja                                                              \
            -DCMAKE_BUILD_TYPE=Release                                            \
            "-DCMAKE_C_COMPILER=clang-${LLVM_VERSION}"                            \
            "-DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION}"                        \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++                                      \
            "-DONLYC_SITE_ORIGIN=${ONLYC_SITE_ORIGIN}"                            \
            "-DONLYC_WASM_CMAKE_ARGS=${wasm_flags}"

      - name: Build Website
        run: cmake --build build --parallel

      - name: Run Host Tests
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"

      - name: Upload Website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: build/site
          if-no-files-found: error

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Set Up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Check Pages Origin
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ -n "${PAGES_BASE_PATH}" || "${PAGES_ORIGIN}" != "${ONLYC_SITE_ORIGIN}" ]]; then
            echo "::error::Configure Pages with the domain root for ${ONLYC_SITE_ORIGIN}."
            exit 1
          fi

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v5
