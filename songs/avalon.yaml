annotations:
  note-verse-1-2: >-
    "Hòn đảo" ở đây nhắc đến _Avalon_, nơi yên nghỉ của vua Arthur trong truyền thuyết Anh.
  note-verse-1-3: >-
    Trong tiếng Việt, "xe điện" thường chỉ xe ô tô chạy bằng điện, còn _Metro_ ở đây thường được
    dịch thành "tàu điện". Tuy nhiên, nếu để là "tàu điện" thì bản dịch sẽ không hợp giai điệu.


    "Xe điện ngầm" có lẽ đủ để gợi đến hình ảnh của những chiếc tàu công nghệ cao chạy dưới lòng đất
    ở những đảo quốc phát triển như Nhật Bản hay Singapore - còn ở Việt Nam thì ta chỉ có xe điện...
    ngập.
sections:
- label: "Verse 1"
  original: |-
    Somewhere beyond your wildest dreams
    There's an island waiting for you
    Dark skies, Metro under ground
    All of your dreams coming true
  translated: |-
    Ngoài kia, không biết ở nơi nào
    Hòn đảo thiên đường mở lối đón chào
    Trời khuya, những chuyến xe điện ngầm
    Tất cả ước mơ hóa thành thật
  annotations:
  - start: "2"
    end: "2"
    ref: "note-verse-1-2"
  - start: "3"
    end: "3"
    ref: "note-verse-1-3"
- label: "Hook"
  original: |-
    There's a place, We can go
    Through the fire and the smoke
    Come with me
    On our way
    We're at the end of the world
  translated: |-
    Một đích đến, để ta đi
    Vượt bao khói lửa và hiểm nguy
    Theo bước mình
    Trên con đường
    Cùng nhau tới nơi cuối trần gian
  annotations: []
- label: "Hook"
